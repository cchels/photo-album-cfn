AWSTemplateFormatVersion: '2010-09-09'
Description: index-photos & search-photos Lambdas (inline code)

Resources:
  IndexPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: index-photos
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !ImportValue PhotoAlbum-IndexRoleArn
      Timeout: 10
      MemorySize: 128
      Layers: [ arn:aws:lambda:us-east-1:825765411228:layer:Python_Request:4 ]
      Environment:
        Variables:
          REGION:      us-east-1
          ES_ENDPOINT: https://search-photos-2kdopq4li5ts2w6mcaqobflreu.us-east-1.es.amazonaws.com
          ES_INDEX:    photos
          ES_USERNAME: admin
          ES_PASSWORD: Test1234!
      Code:
        ZipFile: |
          import os, json, boto3, datetime, requests
          from requests.auth import HTTPBasicAuth

          rek = boto3.client('rekognition', region_name=os.environ['REGION'])
          s3  = boto3.client('s3',        region_name=os.environ['REGION'])
          ES_ENDPOINT = os.environ['ES_ENDPOINT']
          ES_INDEX    = os.environ['ES_INDEX']
          ES_USER     = os.environ['ES_USERNAME']
          ES_PASS     = os.environ['ES_PASSWORD']

          def lambda_handler(event, context):
              rec    = event['Records'][0]['s3']
              bucket = rec['bucket']['name']
              key    = rec['object']['key']
              labels = [l['Name'] for l in rek.detect_labels(Image={'S3Object':{'Bucket':bucket,'Name':key}})['Labels']]
              meta   = s3.head_object(Bucket=bucket,Key=key).get('Metadata',{})
              custom = [c.strip() for c in meta.get('customlabels','').split(',') if c.strip()]
              all_labels = list({*labels,*custom})
              doc = { 'objectKey':key, 'bucket':bucket,
                      'createdTimestamp': datetime.datetime.utcnow().isoformat(),
                      'labels': all_labels }
              url = f"{ES_ENDPOINT}/{ES_INDEX}/_doc"
              r = requests.post(url, auth=HTTPBasicAuth(ES_USER,ES_PASS),
                                headers={'Content-Type':'application/json'},
                                data=json.dumps(doc))
              r.raise_for_status()
              return { 'statusCode':200, 'body': json.dumps({'indexed':key}) }

  SearchPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: search-photos
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !ImportValue PhotoAlbum-SearchRoleArn
      Timeout: 10
      MemorySize: 128
      Layers: [ arn:aws:lambda:us-east-1:825765411228:layer:Python_Request:4 ]
      Environment:
        Variables:
          REGION:        us-east-1
          ES_ENDPOINT:   https://search-photos-2kdopq4li5ts2w6mcaqobflreu.us-east-1.es.amazonaws.com
          ES_INDEX:      photos
          ES_USERNAME:   admin
          ES_PASSWORD:   Test1234!
          BOT_ID:        PEPR7UR3MW
          BOT_ALIAS_ID:  TSTALIASID
          LOCALE_ID:     en_US
      Code:
        ZipFile: |
          import os, json, boto3, requests
          from requests.auth import HTTPBasicAuth

          lex = boto3.client('lexv2-runtime', region_name=os.environ['REGION'])
          ES_ENDPOINT = os.environ['ES_ENDPOINT']
          ES_INDEX    = os.environ['ES_INDEX']
          ES_USER     = os.environ['ES_USERNAME']
          ES_PASS     = os.environ['ES_PASSWORD']

          def lambda_handler(event, context):
              q = (event.get('queryStringParameters') or {}).get('q','').strip()
              if not q:
                  return { 'statusCode':200,'headers':{'Content-Type':'application/json','Access-Control-Allow-Origin':'*'},'body':json.dumps({'results':[]}) }
              lr = lex.recognize_text(
                botId      = os.environ['BOT_ID'],
                botAliasId = os.environ['BOT_ALIAS_ID'],
                localeId   = os.environ['LOCALE_ID'],
                sessionId  = context.aws_request_id,
                text       = q
              )
              slot = lr['sessionState']['intent']['slots'].get('query1',{})
              term = slot.get('value',{}).get('interpretedValue', q)
              es_q = { "query": {"match": {"labels": {"query": term, "fuzziness": "AUTO"}}}}
              url  = f"{ES_ENDPOINT}/{ES_INDEX}/_search"
              r    = requests.get(url, auth=HTTPBasicAuth(ES_USER,ES_PASS),
                                  headers={'Content-Type':'application/json'}, json=es_q)
              hits = r.json().get('hits',{}).get('hits',[])
              results = [
                {"url":f"https://{h['_source']['bucket']}.s3.amazonaws.com/{h['_source']['objectKey']}",
                 "labels":h['_source']['labels']}
                for h in hits
              ]
              return {
                'statusCode':200,
                'headers':{'Content-Type':'application/json','Access-Control-Allow-Origin':'*'},
                'body':json.dumps({'results':results})
              }
