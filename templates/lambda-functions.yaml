AWSTemplateFormatVersion: '2010-09-09'
Description: cfn-index-photos & cfn-search-photos Lambda functions

Parameters:
  ESDomainEndpoint:
    Type: String
    Description: Exported OpenSearch endpoint

Resources:
  cfnIndexPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cfn-index-photos
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt cfnIndexLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Layers:
        - arn:aws:lambda:us-east-1:825765411228:layer:Python_Request:4
      Environment:
        Variables:
          REGION:      us-east-1
          ES_ENDPOINT: !ImportValue cfn-PhotoAlbum-ESDomainEndpoint
          ES_INDEX:    photos
          ES_USERNAME: admin
          ES_PASSWORD: Test1234!
      Code:
        ZipFile: |
          import os
          import json
          import datetime
          import boto3
          import requests
          from requests.auth import HTTPBasicAuth

          # ─── Environment Variables ─────────────────────────────────────────────
          REGION      = os.environ['REGION']
          ES_ENDPOINT = os.environ['ES_ENDPOINT']
          ES_INDEX    = os.environ['ES_INDEX']
          ES_USERNAME = os.environ['ES_USERNAME']
          ES_PASSWORD = os.environ['ES_PASSWORD']

          # ─── AWS Clients ────────────────────────────────────────────────────────
          # Rekognition: detectLabels on images in S3
          rek = boto3.client('rekognition', region_name=REGION)
          # S3: read metadata from objects
          s3  = boto3.client('s3', region_name=REGION)

          def lambda_handler(event, context):
              """
              Main entrypoint for index-photos function.
              Expects an S3 PUT event in `event['Records'][0]`.
              """

              # 1) Extract bucket name and object key from event
              try:
                  rec    = event['Records'][0]['s3']
                  bucket = rec['bucket']['name']
                  key    = rec['object']['key']
              except (KeyError, IndexError):
                  raise ValueError("Event does not contain S3 PUT record")

              # 2) Call Rekognition.detect_labels to get auto-generated labels
              rek_resp = rek.detect_labels(
                  Image={'S3Object': {'Bucket': bucket, 'Name': key}},
                  MaxLabels=10,
                  MinConfidence=75
              )
              auto_labels = [lbl['Name'] for lbl in rek_resp.get('Labels', [])]

              # 3) Retrieve custom labels from S3 metadata: x-amz-meta-customlabels
              head = s3.head_object(Bucket=bucket, Key=key)
              raw_meta = head.get('Metadata', {}).get('customlabels', '')
              custom_labels = [
                  label.strip() for label in raw_meta.split(',')
                  if label.strip()
              ]

              # 4) Combine and dedupe
              all_labels = list({*map(str.lower, auto_labels), *map(str.lower, custom_labels)})

              # 5) Build document to index
              doc = {
                  "objectKey":        key,
                  "bucket":           bucket,
                  "createdTimestamp": datetime.datetime.utcnow().isoformat(),
                  "labels":           all_labels
              }

              # 6) Index document into OpenSearch
              url = f"{ES_ENDPOINT}/{ES_INDEX}/_doc"
              auth = HTTPBasicAuth(ES_USERNAME, ES_PASSWORD)
              headers = {"Content-Type": "application/json"}
              resp = requests.post(url, auth=auth, headers=headers, data=json.dumps(doc))

              # 7) Check response status
              if resp.status_code not in (200, 201):
                  print(f"[ERROR] OpenSearch indexing failed: {resp.status_code} {resp.text}")
                  raise Exception(f"Indexing failed: {resp.status_code}")

              print(f"[SUCCESS] Indexed {key} with labels: {all_labels}")
              return {
                  "statusCode": resp.status_code,
                  "body":       json.dumps({"indexed": key})
              }


  cfnSearchPhotosFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: cfn-search-photos
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt cfnSearchLambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Layers:
        - arn:aws:lambda:us-east-1:825765411228:layer:Python_Request:4
      Environment:
        Variables:
          REGION:      us-east-1
          ES_ENDPOINT: !ImportValue cfn-PhotoAlbum-ESDomainEndpoint
          ES_INDEX:    photos
          ES_USERNAME: admin
          ES_PASSWORD: Test1234!
          BOT_ID:      PEPR7UR3MW
          BOT_ALIAS_ID:TSTALIASID
          LOCALE_ID:   en_US
      Code:
        ZipFile: |
          import os
          import json
          import boto3
          import requests
          from requests.auth import HTTPBasicAuth

          # ─── Environment Variables ─────────────────────────────────────────────
          REGION       = os.environ['REGION']
          ES_ENDPOINT  = os.environ['ES_ENDPOINT']
          ES_INDEX     = os.environ['ES_INDEX']
          ES_USERNAME  = os.environ['ES_USERNAME']
          ES_PASSWORD  = os.environ['ES_PASSWORD']
          LEX_BOT_ID    = os.environ['BOT_ID']
          LEX_ALIAS_ID  = os.environ['BOT_ALIAS_ID']
          LEX_LOCALE    = os.environ['LOCALE_ID']

          # ─── AWS Clients ────────────────────────────────────────────────────────
          lex_client = boto3.client('lexv2-runtime', region_name=REGION)

          def lambda_handler(event, context):
              """
              Handles GET /search via API Gateway Lambda Proxy Integration.
              Expects event['queryStringParameters']['q'] to contain the search text.
              """

              # 1) Extract raw query text "q"
              params = event.get('queryStringParameters') or {}
              raw_q = params.get('q', '').strip()
              if not raw_q:
                  return _response(200, {"results": []})

              # 2) Disambiguate via Lex V2 RecognizeText
              try:
                  lex_resp = lex_client.recognize_text(
                      botId       = LEX_BOT_ID,
                      botAliasId  = LEX_ALIAS_ID,
                      localeId    = LEX_LOCALE,
                      sessionId   = context.aws_request_id,
                      text        = raw_q
                  )
                  slot = lex_resp['sessionState']['intent']['slots'].get('query1', {})
                  term = slot.get('value', {}).get('interpretedValue', raw_q)
              except Exception as e:
                  print(f"[WARN] Lex recognize_text failed: {e}")
                  term = raw_q  # fallback to raw text

              # 3) Build OpenSearch fuzzy-match query
              es_query = {
                  "query": {
                      "match": {
                          "labels": {
                              "query": term,
                              "fuzziness": "AUTO"
                          }
                      }
                  }
              }

              # 4) Call OpenSearch _search endpoint
              url = f"{ES_ENDPOINT}/{ES_INDEX}/_search"
              auth = HTTPBasicAuth(ES_USERNAME, ES_PASSWORD)
              headers = {"Content-Type": "application/json"}

              try:
                  es_resp = requests.get(url, auth=auth, headers=headers, json=es_query)
                  es_resp.raise_for_status()
                  hits = es_resp.json().get('hits', {}).get('hits', [])
              except Exception as e:
                  print(f"[ERROR] OpenSearch query failed: {e}")
                  return _response(500, {"error": "Search service unavailable"})

              # 5) Format results as list of {url, labels}
              results = []
              for h in hits:
                  src = h.get('_source', {})
                  bucket = src.get('bucket')
                  key    = src.get('objectKey')
                  if bucket and key:
                      url = f"https://{bucket}.s3.amazonaws.com/{key}"
                      results.append({"url": url, "labels": src.get('labels', [])})

              # 6) Return JSON array
              return _response(200, {"results": results})

          def _response(status_code, body_dict):
              """
              Helper to build Lambda Proxy integration response.
              Adds CORS header to allow any origin.
              """
              return {
                  "statusCode": status_code,
                  "headers": {
                      "Content-Type":                "application/json",
                      "Access-Control-Allow-Origin": "*"
                  },
                  "body": json.dumps(body_dict)
              }

Outputs:
  cfnIndexFunctionArn:
    Value: !GetAtt cfnIndexPhotosFunction.Arn
    Export:
      Name: cfn-PhotoAlbum-IndexFunctionArn

  cfnSearchFunctionArn:
    Value: !GetAtt cfnSearchPhotosFunction.Arn
    Export:
      Name: cfn-PhotoAlbum-SearchFunctionArn
