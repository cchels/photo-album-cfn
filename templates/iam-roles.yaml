AWSTemplateFormatVersion: '2010-09-09'
Description: IAM roles & policies for Lambdas & API→S3 proxy

Parameters:
  ESDomainArn:
    Type: String
    Description: ARN of existing OpenSearch domain with wildcard

Resources:
  IndexLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaIndexFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IndexLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: IndexS3AndRekognition
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${PhotoAlbum-PhotoBucketName}/*'
              - Effect: Allow
                Action: rekognition:DetectLabels
                Resource: '*'
        - PolicyName: IndexOpenSearch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - es:ESHttpPost
                  - es:ESHttpPut
                Resource: !Ref ESDomainArn

  SearchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: LambdaSearchFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SearchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: SearchS3AndOpenSearch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:aws:s3:::${PhotoAlbum-PhotoBucketName}'
                  - !Sub 'arn:aws:s3:::${PhotoAlbum-PhotoBucketName}/*'
              - Effect: Allow
                Action: es:ESHttpGet
                Resource: !Ref ESDomainArn
        - PolicyName: SearchLex
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lex:RecognizeText
                Resource: '*'

  ApiGatewayS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: APIGatewayS3Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ProxyToS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${PhotoAlbum-PhotoBucketName}/*'
        - PolicyName: ApiGatewayLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
