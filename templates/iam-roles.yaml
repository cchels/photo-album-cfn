AWSTemplateFormatVersion: '2010-09-09'
Description: IAM roles for Lambdas & API→S3 proxy.

Parameters:
  cfn-ESDomainArn:
    Type: String
    Description: Exported ARN of OpenSearch domain (with /*)

Resources:
  cfn-IndexLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cfn-LambdaIndexFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-IndexLogs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup,logs:CreateLogStream,logs:PutLogEvents]
                Resource: '*'
        - PolicyName: cfn-IndexS3AndRekognition
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:aws:s3:::${cfn-PhotoAlbum-PhotoBucketName}/*'
              - Effect: Allow
                Action: rekognition:DetectLabels
                Resource: '*'
        - PolicyName: cfn-IndexOpenSearch
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [es:ESHttpPost,es:ESHttpPut]
                Resource: !Ref cfn-ESDomainArn

  cfn-SearchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cfn-LambdaSearchFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-SearchLogs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup,logs:CreateLogStream,logs:PutLogEvents]
                Resource: '*'
        - PolicyName: cfn-SearchS3AndOpenSearch
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket,s3:GetObject]
                Resource:
                  - !Sub 'arn:aws:s3:::${cfn-PhotoAlbum-PhotoBucketName}'
                  - !Sub 'arn:aws:s3:::${cfn-PhotoAlbum-PhotoBucketName}/*'
              - Effect: Allow
                Action: es:ESHttpGet
                Resource: !Ref cfn-ESDomainArn
        - PolicyName: cfn-SearchLex
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: lex:RecognizeText
                Resource: '*'  # can tighten to bot-alias ARN

  cfn-ApiGatewayS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cfn-APIGatewayS3Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: apigateway.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-ProxyToS3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub 'arn:aws:s3:::${cfn-PhotoAlbum-PhotoBucketName}/*'
        - PolicyName: cfn-ApiGatewayLogs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup,logs:CreateLogStream,logs:PutLogEvents]
                Resource: '*'
