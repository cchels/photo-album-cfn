AWSTemplateFormatVersion: '2010-09-09'
Description: IAM roles & policies for Lambdas & API→S3

Parameters:
  cfnESDomainArn:
    Type: String
    Description: ARN of your existing OpenSearch domain (must include /*)

Resources:
  cfnIndexLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cfn-LambdaIndexFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-IndexLogs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: cfn-IndexS3AndRekognition
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                      - 'arn:aws:s3:::${PhotoBucketName}/*'
                      - { PhotoBucketName: !ImportValue cfn-PhotoAlbum-PhotoBucketName }
              - Effect: Allow
                Action:
                  - rekognition:DetectLabels
                Resource: '*'
        - PolicyName: cfn-IndexOpenSearch
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - es:ESHttpPost
                  - es:ESHttpPut
                Resource: !Ref cfnESDomainArn

  cfnSearchLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cfn-LambdaSearchFunctionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-SearchLogs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
        - PolicyName: cfn-SearchS3AndOpenSearch
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub
                      - 'arn:aws:s3:::${PhotoBucketName}'
                      - { PhotoBucketName: !ImportValue cfn-PhotoAlbum-PhotoBucketName }
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub
                      - 'arn:aws:s3:::${PhotoBucketName}/*'
                      - { PhotoBucketName: !ImportValue cfn-PhotoAlbum-PhotoBucketName }
              - Effect: Allow
                Action:
                  - es:ESHttpGet
                Resource: !Ref cfnESDomainArn
        - PolicyName: cfn-SearchLex
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - lex:RecognizeText
                Resource: '*'

  cfnApiGatewayS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: cfn-APIGatewayS3Role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-ProxyToS3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub
                      - 'arn:aws:s3:::${PhotoBucketName}/*'
                      - { PhotoBucketName: !ImportValue cfn-PhotoAlbum-PhotoBucketName }
        - PolicyName: cfn-ApiGatewayLogs
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

Outputs:
  IndexLambdaRoleArn:
    Description: ARN of the Index-Photos Lambda execution role
    Value: !GetAtt cfnIndexLambdaRole.Arn
    Export:
      Name: cfn-PhotoAlbum-IndexLambdaRoleArn

  SearchLambdaRoleArn:
    Description: ARN of the Search-Photos Lambda execution role
    Value: !GetAtt cfnSearchLambdaRole.Arn
    Export:
      Name: cfn-PhotoAlbum-SearchLambdaRoleArn

  ApiGatewayS3RoleArn:
    Description: ARN of the API Gateway → S3 proxy role
    Value: !GetAtt cfnApiGatewayS3Role.Arn
    Export:
      Name: cfn-PhotoAlbum-ApiGatewayS3RoleArn