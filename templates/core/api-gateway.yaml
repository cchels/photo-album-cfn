AWSTemplateFormatVersion: '2010-09-09'
Description: cfn API Gateway for upload & search

Resources:

  cfnPhotoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: cfn-PhotoAlbumAPI
      BinaryMediaTypes:
        - image/png
        - image/jpg
        - image/jpeg
        - image/heic
      EndpointConfiguration:
        Types:
          - REGIONAL

# ─── SHARED MODELS ─────────────────────────────────────────────────────────
  cfnPhotoModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ContentType: application/json
      Name: Photo
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: Photo
        type: object
        properties:
          url:
            type: string
          labels:
            type: array
            items:
              type: string

  cfnSearchResponseModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref cfnPhotoApi
      Name: SearchResponse
      ContentType: application/json
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: SearchResponse
        type: object
        properties:
          results:
            type: array
            items:
              type: object
              properties:
                url:
                  type: string
                labels:
                  type: array
                  items:
                    type: string

  cfnUploadResponseModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ContentType: application/json
      Name: UploadResponse
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: UploadResponse
        type: object
        properties: {}

  cfnErrorModel:
    Type: AWS::ApiGateway::Model
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ContentType: application/json
      Name: ErrorResponse
      Schema:
        $schema: "http://json-schema.org/draft-04/schema#"
        title: ErrorResponse
        type: object
        properties:
          code:
            type: integer
          message:
            type: string
 
  cfnUploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ParentId: !GetAtt cfnPhotoApi.RootResourceId
      PathPart: upload

  cfnPutUploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ResourceId: !Ref cfnUploadResource
      HttpMethod: PUT
      AuthorizationType: NONE
      RequestParameters:
        method.request.querystring.filename: true
        method.request.header.Content-Type: true
        method.request.header.x-amz-meta-customLabels: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: PUT
        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:s3:path/${PhotoBucket}/{objectKey}'
            - PhotoBucket: !ImportValue cfn-PhotoAlbum-PhotoBucketName
        Credentials: !ImportValue cfn-PhotoAlbum-ApiGatewayS3RoleArn
        PassthroughBehavior: WHEN_NO_TEMPLATES
        RequestParameters:
          integration.request.path.objectKey:     method.request.querystring.filename
          integration.request.header.Content-Type: method.request.header.Content-Type
          integration.request.header.x-amz-meta-customLabels: method.request.header.x-amz-meta-customLabels
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
            ResponseTemplates:
              application/json: ""
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: !Ref cfnUploadResponseModel
        - StatusCode: 403
          ResponseModels:
            application/json: !Ref cfnErrorModel
        - StatusCode: 500
          ResponseModels:
            application/json: !Ref cfnErrorModel

  cfnOptionsUpload:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ResourceId: !Ref cfnUploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{ "statusCode": 200 }'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token, x-amz-meta-customLabels'"
              method.response.header.Access-Control-Allow-Methods: "'PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin:  "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers:  true
            method.response.header.Access-Control-Allow-Methods:  true
            method.response.header.Access-Control-Allow-Origin:   true

  cfnSearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref cfnPhotoApi
      ParentId: !GetAtt cfnPhotoApi.RootResourceId
      PathPart:  search

  cfnGetSearch:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:  !Ref cfnPhotoApi
      ResourceId: !Ref cfnSearchResource
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.querystring.q: false
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri:
          Fn::Sub:
            - 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFnArn}/invocations'
            - SearchFnArn: !ImportValue cfn-PhotoAlbum-SearchFunctionArn
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
          ResponseModels:
            application/json: !Ref cfnSearchResponseModel
        - StatusCode: 403
          ResponseModels:
            application/json: !Ref cfnErrorModel
        - StatusCode: 500
          ResponseModels:
            application/json: !Ref cfnErrorModel

  cfnOptionsSearch:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId:  !Ref cfnPhotoApi
      ResourceId: !Ref cfnSearchResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{ "statusCode": 200 }'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"  # ← fixed stray quote
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin:  "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers:  true
            method.response.header.Access-Control-Allow-Methods:  true
            method.response.header.Access-Control-Allow-Origin:   true

  cfnPermissionSearchInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue cfn-PhotoAlbum-SearchFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${cfnPhotoApi}/*/GET/search

  cfnApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - cfnPutUploadMethod
      - cfnOptionsUpload
      - cfnGetSearch
      - cfnOptionsSearch
    Properties:
      RestApiId: !Ref cfnPhotoApi
      StageName: prod

Outputs:
  cfnApiUrl:
    Description: Base URL of your API
    Value: !Sub 'https://${cfnPhotoApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: cfn-PhotoAlbum-ApiUrl

  cfnApiId:
    Description: API identifier
    Value: !Ref cfnPhotoApi
    Export:
      Name: cfn-PhotoAlbum-ApiId
      