AWSTemplateFormatVersion: '2010-09-09'
Description: >
  API Gateway:
    • PUT  /upload?filename=… → S3 proxy (binary media, CORS)
    • GET  /search?q=…       → Lambda proxy + CORS
    • OPTIONS on both for preflight

Resources:
  PhotoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: PhotoAlbumAPI
      BinaryMediaTypes:
        - 'image/png'
        - 'image/jpg'
        - 'image/jpeg'
        - 'image/heic'

  ## ── /upload ─────────────────────────────────────────────────────────────
  UploadResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PhotoApi
      ParentId: !GetAtt PhotoApi.RootResourceId
      PathPart: upload

  PutUploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PhotoApi
      ResourceId: !Ref UploadResource
      HttpMethod: PUT
      AuthorizationType: NONE
      RequestParameters:
        method.request.querystring.filename:           true
        method.request.header.Content-Type:            true
        method.request.header.x-amz-meta-customLabels: false
      Integration:
        Type: AWS
        IntegrationHttpMethod: PUT
        Uri: !Sub >
          arn:aws:apigateway:${AWS::Region}:s3:path/${PhotoAlbum-PhotoBucketName}/{objectKey}
        Credentials: !ImportValue PhotoAlbum-ApiGatewayS3RoleArn
        PassthroughBehavior: WHEN_NO_TEMPLATES
        RequestParameters:
          integration.request.path.objectKey:              'method.request.querystring.filename'
          integration.request.header.Content-Type:         'method.request.header.Content-Type'
          integration.request.header.x-amz-meta-customLabels: 'method.request.header.x-amz-meta-customLabels'

  OptionsUpload:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PhotoApi
      ResourceId: !Ref UploadResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          'application/json': '{ "statusCode": 200 }'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-amz-meta-customLabels'"
              method.response.header.Access-Control-Allow-Methods: "'PUT,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin:  "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin:  true

  ## ── /search ─────────────────────────────────────────────────────────────
  SearchResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref PhotoApi
      ParentId: !GetAtt PhotoApi.RootResourceId
      PathPart: search

  GetSearch:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PhotoApi
      ResourceId: !Ref SearchResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub >
          arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchFunctionArn}/invocations

  OptionsSearch:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref PhotoApi
      ResourceId: !Ref SearchResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          'application/json': '{ "statusCode": 200 }'
        IntegrationResponses:
          - StatusCode: 200
            ResponseParameters:
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Origin:  "'*'"
      MethodResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Origin:  true

  ## ── Lambda permission for API Gateway to invoke search-photos ─────────
  PermissionSearchInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue PhotoAlbum-SearchFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${PhotoApi}/*/GET/search

Outputs:
  ApiUrl:
    Description: Base URL of your REST API
    Value: !Sub 'https://${PhotoApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  ApiId:
    Description: REST API identifier
    Value: !Ref PhotoApi
    Export: { Name: PhotoAlbum-ApiId }
